<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulated Payment · Sanjeevani demo</title>
  <link rel="icon" type="image/png" href="/dashboard/assets/web/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* Our own simulated payment window (Blend tokens, design.md). Not styled after any payment provider. */
    :root {
      --bg: #F5F7FA; --card: #FFFFFF; --text: #0E121B; --text-2: #525866; --muted: #717784; --border: #E1E4EA;
      --blue: #2B7FFF; --blue-600: #0561E2; --green: #00A63E; --green-50: #F0FDF4; --orange: #FF6900; --orange-100: #FFEDD4;
      --font: 'Inter', -apple-system, system-ui, Roboto, 'Helvetica Neue', sans-serif;
      --mono: 'SF Mono', Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--text); font: 400 14px/20px var(--font); padding: 20px; }
    .card { max-width: 520px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px 1px rgba(5, 5, 6, .07); }
    .banner { background: var(--orange-100); color: #9A3412; font: 600 12px/18px var(--font); letter-spacing: .03em; text-transform: uppercase; padding: 10px 20px; display: flex; gap: 8px; align-items: center; }
    .banner i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .body { padding: 20px; }
    .merchant { display: flex; justify-content: space-between; align-items: baseline; }
    .merchant b { font-size: 16px; font-weight: 600; }
    .muted { color: var(--muted); font-size: 12px; }
    .amount { font: 700 40px/46px var(--font); margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
    .item { color: var(--text-2); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0; padding: 14px 16px; background: var(--bg); border-radius: 10px; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 12px; word-break: break-all; }
    .method { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--blue); background: #EFF6FF; border-radius: 10px; padding: 12px 14px; font-weight: 500; }
    .method .dot { width: 16px; height: 16px; border-radius: 50%; border: 5px solid var(--blue); background: #fff; }
    button { width: 100%; margin-top: 16px; height: 48px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: 600 15px var(--font); cursor: pointer; }
    button:hover { background: var(--blue-600); }
    button:disabled { background: #99A0AE; cursor: default; }
    .auto { text-align: center; margin-top: 8px; color: var(--muted); font-size: 12px; min-height: 18px; }
    .done { display: none; text-align: center; padding: 26px 20px 6px; }
    .done .tick { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; background: var(--green-50); color: var(--green); display: grid; place-items: center; font-size: 28px; font-weight: 700; }
    .done h2 { margin: 0 0 4px; font-size: 20px; }
    .confirmed .pay { display: none; }
    .confirmed .done { display: block; }
    h3 { font: 600 12px/18px var(--font); color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 7px 6px; border-top: 1px solid var(--border); vertical-align: top; }
    td.m { font: 600 11px/18px var(--mono); width: 44px; }
    td.u { font: 400 11px/18px var(--mono); color: var(--text-2); word-break: break-all; }
    td.s { font: 600 11px/18px var(--mono); text-align: right; width: 40px; }
    td.s.ok { color: var(--green); } td.s.wait { color: var(--muted); }
    .lbl { font: 600 9px/16px var(--mono); padding: 0 5px; border-radius: 4px; border: 1px solid; white-space: nowrap; display: inline-block; }
    .lbl.SANDBOX { color: var(--blue); } .lbl.SIMULATED { color: var(--orange); }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card" id="card" hidden>
    <div class="banner"><i></i>Simulated payment · Sanjeevani demo · no money moves</div>
    <div class="body">
      <div class="merchant"><b id="merchant">—</b><span class="muted">Paying for Maa</span></div>
      <div class="amount" id="amount">—</div>
      <div class="item" id="item">—</div>
      <dl>
        <dt>Pine Labs UAT order</dt><dd id="orderId">—</dd>
        <dt>Merchant reference</dt><dd id="ref">—</dd>
        <dt>Payment session</dt><dd id="sid">—</dd>
      </dl>
      <div class="pay">
        <div class="method"><span class="dot"></span><span id="card4">Test card</span></div>
        <button type="button" id="confirm">Confirm test payment</button>
        <div class="auto" id="auto"></div>
      </div>
      <div class="done">
        <div class="tick">✓</div>
        <h2>Payment confirmed · simulated</h2>
        <div class="muted" id="paid">—</div>
      </div>
      <h3>Endpoints</h3>
      <table><tbody id="endpoints"></tbody></table>
    </div>
  </div>
  <div class="empty" id="empty">No payment is waiting.</div>

  <script>
    (function () {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const wanted = new URLSearchParams(location.search).get('s');
      let current = null;
      let countdown = null;
      let sending = false;

      function render(s) {
        const o = s.order;
        $('#merchant').textContent = o.pharmacy;
        $('#amount').textContent = `₹${Number(o.amount_inr).toLocaleString('en-IN')}`;
        $('#item').textContent = o.item;
        $('#orderId').textContent = o.pinelabs_order_id;
        $('#ref').textContent = o.merchant_order_reference;
        $('#sid').textContent = s.id;
        $('#card4').textContent = o.card;
        $('#confirm').textContent = `Confirm test payment · ₹${Number(o.amount_inr).toLocaleString('en-IN')}`;
        $('#endpoints').innerHTML = s.endpoints.map((e) => `<tr>
          <td class="m">${esc(e.method)}</td>
          <td class="u">${esc(e.url)} <span class="lbl ${esc(e.label)}">${esc(e.label)}</span></td>
          <td class="s ${e.status ? 'ok' : 'wait'}">${e.status ? esc(e.status) : '…'}</td></tr>`).join('');
        $('#card').classList.toggle('confirmed', s.status === 'confirmed');
        if (s.status === 'confirmed') {
          $('#paid').textContent = `${s.payment_id} · confirmed by ${s.confirmed_by}`;
          stopCountdown();
        }
      }

      function stopCountdown() { clearInterval(countdown); countdown = null; $('#auto').textContent = ''; }

      function startCountdown(seconds) {
        if (countdown || !seconds) return;
        let left = seconds;
        const tick = () => {
          if (left <= 0) { stopCountdown(); confirm(); return; }
          $('#auto').textContent = `Confirming automatically in ${left}s`;
          left -= 1;
        };
        tick();
        countdown = setInterval(tick, 1000);
      }

      async function confirm() {
        if (!current || current.status !== 'pending' || sending) return;
        sending = true;
        $('#confirm').disabled = true;
        stopCountdown();
        try {
          await fetch('/pay/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: current.id }) });
        } catch (_) { /* the next poll shows the real state */ }
        sending = false;
        poll();
      }

      async function poll() {
        let s;
        try { s = await (await fetch('/pay/session', { cache: 'no-store' })).json(); } catch (_) { return; }
        const usable = s.active && (!wanted || s.id === wanted);
        $('#card').hidden = !usable;
        $('#empty').hidden = usable;
        if (!usable) { $('#empty').textContent = s.active ? 'This payment window has expired.' : 'No payment is waiting.'; stopCountdown(); current = null; return; }
        if (!current || current.id !== s.id) { $('#confirm').disabled = false; }
        current = s;
        render(s);
        if (s.status === 'pending') startCountdown(s.auto_confirm_s);
      }

      $('#confirm').addEventListener('click', confirm);
      poll();
      setInterval(poll, 1000);
    })();
  </script>
</body>
</html>
